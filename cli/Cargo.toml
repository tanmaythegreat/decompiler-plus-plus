[package]
name = "decompiler-cli"
version.workspace = true
edition.workspace = true
description = "Runs the full Phase 1 + Phase 2 pipeline: disassembles and lifts x86 bytes into the ir-pcode IR, builds a CFG, runs constant propagation, and prints C pseudocode."

[[bin]]
name = "decompiler-cli"
path = "src/main.rs"

[dependencies]
decompiler-core = { path = "../decompiler-core" }
ir-pcode = { path = "../ir-pcode" }
arch-x86 = { path = "../arch-x86" }
arch-arm = { path = "../arch-arm" }
analysis-passes = { path = "../analysis-passes" }
output-c = { path = "../output-c" }
